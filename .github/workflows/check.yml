# Everything, on every change.
#
# `scripts/check.sh` is the one definition of "the tests pass", here as on a
# laptop: this file only decides when to run it. It builds the package, runs
# the Swift lane, the Python lane, the expression checks and the
# cross-language schema round trip. There is no slow form any more: the
# end-to-end comparisons against the Python plates were the cutover's test,
# and what they measured is now held by the Swift lane against analytic
# references, in seconds rather than minutes.
#
# Before it, the fixture generator is run and its output compared with what is
# committed. The fixtures are the contract both lanes read, and a generator
# that no longer reproduces them is drift that a green run would otherwise
# hide. The git SHA each manifest records is the one line allowed to differ.
#
# The runner is Apple Silicon: the Swift lane draws with Metal, and a run that
# finds no device fails rather than skips (see kurven-test's Harness.swift),
# which is the way to learn that an image has lost its GPU.

name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # v7 is the newest floating major tag the action publishes; the v8+
      # releases exist only as full versions.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Toolchains
        run: |
          swift --version
          uv --version
          uv run --frozen --extra gpu python --version

      - name: The committed fixtures are what the generator writes
        run: |
          uv run --frozen --extra gpu python tests/make_fixtures.py
          git add --intent-to-add tests/fixtures
          git diff --exit-code --stat -I '"gitSha"' -- tests/fixtures

      - name: Check
        run: scripts/check.sh
