# The web port, on every change.
#
# `scripts/check-web.sh` is the one definition of "the port's tests pass",
# here as on a laptop: this file only decides when to run it. It needs no
# Swift and no browser, so it runs on Linux: x86_64, where the Swift lane
# (check.yml) runs on Apple Silicon, which also tests that the port's golden
# files are the same bytes on another platform. A golden that comes out
# different here is a finding, not a file to regenerate.
#
# The toolchain is pinned to the one the goldens were written with, so a
# clippy or rustfmt release cannot turn the check red on its own.

name: check-web

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Rust 1.99.1, with rustfmt, clippy and the wasm target
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy \
            --target wasm32-unknown-unknown
          rustup default 1.99.1

      - uses: actions/setup-node@v5
        with:
          node-version: 26

      - name: Check
        run: scripts/check-web.sh
