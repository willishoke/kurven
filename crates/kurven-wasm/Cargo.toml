[package]
name = "kurven-wasm"
description = "The engine as the page's WebAssembly module"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
kurven-golden = { workspace = true, optional = true }
kurven-session.workspace = true

# The port's golden sets and the timing exports, which the check runs under
# Node; the page's module leaves them out (`--no-default-features`).
[features]
default = ["goldens"]
goldens = ["dep:kurven-golden"]

[lints]
workspace = true
