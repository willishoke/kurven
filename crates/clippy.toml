# One libm, everywhere. Rust's f64::sin and its kin call the system libm on
# native and a compiled-in one on wasm, and the two differ in the last bit,
# so the engine never calls them: it calls kurven_math::real, which calls the
# libm crate on every target. No fused multiply-add either: a fused result
# is not what the unfused arithmetic of the reference computes.
#
# scripts/check-web.sh greps for the same spellings, which also catches a
# call clippy cannot see, such as one in a macro.

disallowed-methods = [
    { path = "f64::sin", reason = "use kurven_math::real::sin" },
    { path = "f64::cos", reason = "use kurven_math::real::cos" },
    { path = "f64::tan", reason = "use kurven_math::real::tan" },
    { path = "f64::sin_cos", reason = "use kurven_math::real::sin and cos" },
    { path = "f64::asin", reason = "use kurven_math::real::asin" },
    { path = "f64::acos", reason = "use kurven_math::real::acos" },
    { path = "f64::atan", reason = "use kurven_math::real::atan" },
    { path = "f64::atan2", reason = "use kurven_math::real::atan2" },
    { path = "f64::sinh", reason = "use kurven_math::real::sinh" },
    { path = "f64::cosh", reason = "use kurven_math::real::cosh" },
    { path = "f64::tanh", reason = "use kurven_math::real::tanh" },
    { path = "f64::asinh", reason = "use kurven_math::real::asinh" },
    { path = "f64::acosh", reason = "use kurven_math::real::acosh" },
    { path = "f64::atanh", reason = "use kurven_math::real::atanh" },
    { path = "f64::exp", reason = "use kurven_math::real::exp" },
    { path = "f64::exp2", reason = "use kurven_math::real::exp2" },
    { path = "f64::exp_m1", reason = "use kurven_math::real::expm1" },
    { path = "f64::ln", reason = "use kurven_math::real::log" },
    { path = "f64::log", reason = "use kurven_math::real::log divided by log of the base" },
    { path = "f64::log2", reason = "use kurven_math::real::log2" },
    { path = "f64::log10", reason = "use kurven_math::real::log10" },
    { path = "f64::ln_1p", reason = "use kurven_math::real::log1p" },
    { path = "f64::powf", reason = "use kurven_math::real::pow" },
    { path = "f64::powi", reason = "use kurven_math::real::pow, or multiply" },
    { path = "f64::hypot", reason = "use kurven_math::real::hypot" },
    { path = "f64::cbrt", reason = "use kurven_math::real::cbrt" },
    { path = "f64::mul_add", reason = "no fused multiply-add: write a * b + c" },
    { path = "f32::sin", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::cos", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::tan", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::sin_cos", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::asin", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::acos", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::atan", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::atan2", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::sinh", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::cosh", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::tanh", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::asinh", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::acosh", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::atanh", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::exp", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::exp2", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::exp_m1", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::ln", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::log", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::log2", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::log10", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::ln_1p", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::powf", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::powi", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::hypot", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::cbrt", reason = "f32 is for the GPU; use kurven_math::real on f64" },
    { path = "f32::mul_add", reason = "no fused multiply-add: write a * b + c" },
    # A NaN's sign bit is platform noise (ARM's default NaN is positive, x86's
    # negative), so nothing reads a sign bit but kurven_math::real, which
    # reads every NaN's as plus.
    { path = "f64::is_sign_negative", reason = "a NaN's sign is platform noise; use kurven_math::real::sign_minus" },
    { path = "f64::is_sign_positive", reason = "a NaN's sign is platform noise; use !kurven_math::real::sign_minus" },
    { path = "f64::total_cmp", reason = "a NaN's sign is platform noise; use kurven_math::real::total_order" },
    { path = "f64::copysign", reason = "a NaN's sign is platform noise; use kurven_math::real::copysign" },
    { path = "f32::is_sign_negative", reason = "f32 is for the GPU; a NaN's sign is platform noise" },
    { path = "f32::is_sign_positive", reason = "f32 is for the GPU; a NaN's sign is platform noise" },
    { path = "f32::total_cmp", reason = "f32 is for the GPU; a NaN's sign is platform noise" },
    { path = "f32::copysign", reason = "f32 is for the GPU; a NaN's sign is platform noise" },
]
